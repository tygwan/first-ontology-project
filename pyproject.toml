[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bimkg"
version = "0.1.0"
description = "BIM ontology/knowledge graph pipeline for SP3D plant model data"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "taegwan-dev" },
]
license = { text = "MIT" }
dependencies = [
    # Ingestion + data handling
    "pandas>=2.2",
    "pydantic>=2.6",
    # Ontology / Knowledge Graph
    "rdflib>=7.0",
    "owlrl>=6.0",
    "pyshacl>=0.26",
    # Graph analytics
    "networkx>=3.3",
    # LLM / GraphRAG
    "anthropic>=0.39",
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    # UI
    "streamlit>=1.39",
    "plotly>=5.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]  # line-length handled by formatter
